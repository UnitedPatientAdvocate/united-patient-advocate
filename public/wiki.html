<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Wiki — Matt's Knowledge Base</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     RESET & BASE
  ============================================================ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:       #0a1628;
    --surface:  #0f1f3d;
    --card:     #132040;
    --border:   #1e3358;
    --cyan:     #00BCD4;
    --cyan-dim: #007a8f;
    --gold:     #FFC107;
    --gold-dim: #a87c00;
    --text:     #e8edf5;
    --muted:    #7a90b0;
    --danger:   #ef5350;
    --success:  #66BB6A;
    --warn:     #FFA726;
    --radius:   10px;
    --sidebar-w: 240px;
  }
  html { font-size: 16px; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* ============================================================
     PASSWORD GATE
  ============================================================ */
  #gate {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999;
    flex-direction: column;
    gap: 1.5rem;
    padding: 2rem;
  }
  #gate .gate-logo {
    font-size: 2.5rem; font-weight: 700;
    background: linear-gradient(135deg, var(--cyan), var(--gold));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; text-align: center;
  }
  #gate .gate-sub {
    color: var(--muted); font-size: 0.9rem; text-align: center;
  }
  #gate .gate-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    width: 100%; max-width: 380px;
    display: flex; flex-direction: column; gap: 1rem;
  }
  #gate input[type="password"] {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    color: var(--text);
    font-size: 1rem;
    width: 100%;
    outline: none;
    transition: border-color .2s;
  }
  #gate input[type="password"]:focus { border-color: var(--cyan); }
  #gate button {
    background: linear-gradient(135deg, var(--cyan), var(--cyan-dim));
    color: #fff; border: none; border-radius: 8px;
    padding: 0.75rem 1rem; font-size: 1rem; font-weight: 600;
    cursor: pointer; transition: opacity .2s;
  }
  #gate button:hover { opacity: 0.85; }
  #gate .gate-error {
    color: var(--danger); font-size: 0.85rem; text-align: center; display: none;
  }
  #gate .lock-icon { font-size: 3rem; text-align: center; }

  /* ============================================================
     MAIN APP (hidden until unlocked)
  ============================================================ */
  #app { display: none; min-height: 100vh; flex-direction: column; }
  #app.visible { display: flex; }

  /* ============================================================
     HEADER
  ============================================================ */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0.75rem 1.25rem;
    display: flex; align-items: center; gap: 1rem;
    position: sticky; top: 0; z-index: 100;
  }
  .header-logo {
    font-size: 1.1rem; font-weight: 700; white-space: nowrap;
    background: linear-gradient(135deg, var(--cyan), var(--gold));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; flex-shrink: 0;
  }
  .header-logo span { font-weight: 300; }
  #search-bar {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.55rem 1rem;
    color: var(--text);
    font-size: 0.9rem;
    outline: none;
    transition: border-color .2s;
    min-width: 0;
  }
  #search-bar:focus { border-color: var(--cyan); }
  #search-bar::placeholder { color: var(--muted); }
  .header-actions { display: flex; gap: 0.5rem; flex-shrink: 0; }
  .btn-icon {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 0.5rem 0.75rem;
    color: var(--muted); cursor: pointer; font-size: 0.85rem;
    transition: all .2s; white-space: nowrap;
  }
  .btn-icon:hover { border-color: var(--cyan); color: var(--cyan); }

  /* mobile menu toggle */
  #menu-toggle {
    display: none;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 0.5rem 0.75rem;
    color: var(--muted); cursor: pointer; font-size: 1.1rem;
  }

  /* ============================================================
     LAYOUT: SIDEBAR + MAIN
  ============================================================ */
  .layout {
    display: flex; flex: 1; overflow: hidden;
  }

  /* ============================================================
     SIDEBAR
  ============================================================ */
  #sidebar {
    width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 1rem 0;
    overflow-y: auto;
    flex-shrink: 0;
    display: flex; flex-direction: column; gap: 0;
  }
  .sidebar-section { padding: 0.5rem 1rem 0; }
  .sidebar-label {
    font-size: 0.7rem; font-weight: 600; letter-spacing: .1em;
    color: var(--muted); text-transform: uppercase; padding: 0.25rem 0.5rem;
  }
  .cat-btn {
    display: flex; align-items: center; gap: 0.6rem;
    width: 100%; padding: 0.55rem 0.75rem;
    background: none; border: none; border-radius: 7px;
    color: var(--text); font-size: 0.875rem; font-weight: 400;
    cursor: pointer; text-align: left; transition: all .15s;
  }
  .cat-btn:hover { background: var(--card); color: var(--cyan); }
  .cat-btn.active { background: rgba(0,188,212,.12); color: var(--cyan); font-weight: 600; }
  .cat-btn .cat-count {
    margin-left: auto;
    font-size: 0.72rem; background: var(--border);
    border-radius: 20px; padding: 1px 7px;
    color: var(--muted);
  }
  .cat-btn.active .cat-count { background: rgba(0,188,212,.2); color: var(--cyan); }
  .sidebar-divider {
    height: 1px; background: var(--border); margin: 0.75rem 1rem;
  }
  .sidebar-stats {
    padding: 0.75rem 1.25rem;
    font-size: 0.78rem; color: var(--muted);
  }

  /* ============================================================
     MAIN CONTENT
  ============================================================ */
  main {
    flex: 1; overflow-y: auto; padding: 1.5rem;
    display: flex; flex-direction: column; gap: 1rem;
  }
  .results-header {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 0.25rem;
  }
  .results-title {
    font-size: 1rem; font-weight: 600; color: var(--text);
  }
  .results-count {
    font-size: 0.8rem; color: var(--muted);
  }

  /* ============================================================
     ENTRY CARDS
  ============================================================ */
  .entry-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
    transition: border-color .2s, transform .15s;
    cursor: pointer;
  }
  .entry-card:hover { border-color: var(--cyan-dim); transform: translateY(-1px); }
  .entry-card.expanded { border-color: var(--cyan); }
  .entry-header {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem;
  }
  .entry-left { flex: 1; min-width: 0; }
  .entry-title {
    font-size: 1rem; font-weight: 600; color: var(--text); margin-bottom: 0.3rem;
  }
  .entry-meta {
    display: flex; align-items: center; flex-wrap: wrap; gap: 0.5rem;
  }
  .entry-cat {
    font-size: 0.72rem; font-weight: 600; padding: 2px 8px;
    border-radius: 20px; border: 1px solid;
  }
  .entry-date { font-size: 0.75rem; color: var(--muted); }
  .entry-chevron {
    color: var(--muted); font-size: 0.85rem; flex-shrink: 0;
    transition: transform .2s; padding-top: 2px;
  }
  .entry-card.expanded .entry-chevron { transform: rotate(180deg); }
  .entry-body {
    display: none; margin-top: 1rem;
    border-top: 1px solid var(--border); padding-top: 1rem;
  }
  .entry-card.expanded .entry-body { display: block; }
  .entry-content {
    font-size: 0.88rem; color: #c4d0e3; line-height: 1.75;
    white-space: pre-wrap; word-break: break-word;
  }
  .entry-tags {
    margin-top: 0.75rem; display: flex; flex-wrap: wrap; gap: 0.4rem;
  }
  .tag {
    font-size: 0.72rem; background: var(--surface);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 2px 8px; color: var(--muted);
  }

  /* Category color schemes */
  [data-cat="Finance"] .entry-cat   { color: var(--gold);    border-color: var(--gold-dim);  background: rgba(255,193,7,.07); }
  [data-cat="Empire"] .entry-cat    { color: var(--cyan);    border-color: var(--cyan-dim);  background: rgba(0,188,212,.07); }
  [data-cat="Personal"] .entry-cat  { color: #AB47BC;        border-color: #6a2e7a;          background: rgba(171,71,188,.07); }
  [data-cat="Conversations"] .entry-cat { color: #42A5F5;    border-color: #1a5e9c;          background: rgba(66,165,245,.07); }
  [data-cat="Decisions"] .entry-cat { color: #EF5350;        border-color: #9a1e1c;          background: rgba(239,83,80,.07); }
  [data-cat="Goals"] .entry-cat     { color: var(--success); border-color: #2e6b31;          background: rgba(102,187,106,.07); }
  [data-cat="Contacts"] .entry-cat  { color: #FF7043;        border-color: #a3300e;          background: rgba(255,112,67,.07); }
  [data-cat="Access"] .entry-cat    { color: #78909C;        border-color: #3e5560;          background: rgba(120,144,156,.07); }

  /* highlight search matches */
  mark { background: rgba(255,193,7,.3); color: var(--gold); border-radius: 2px; }

  /* empty state */
  .empty-state {
    text-align: center; padding: 4rem 2rem; color: var(--muted);
  }
  .empty-state .empty-icon { font-size: 3rem; margin-bottom: 1rem; }
  .empty-state p { font-size: 0.9rem; }

  /* ============================================================
     FOOTER
  ============================================================ */
  footer {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 0.6rem 1.25rem;
    font-size: 0.75rem; color: var(--muted);
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 0.5rem;
  }

  /* ============================================================
     MOBILE CATEGORY DROPDOWN
  ============================================================ */
  #cat-dropdown-wrap {
    display: none;
    padding: 0.5rem 1rem;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  #cat-select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.55rem 1rem;
    color: var(--text);
    font-size: 0.9rem;
    outline: none;
  }

  /* ============================================================
     PRINT/EXPORT MODAL
  ============================================================ */
  #export-modal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.7); z-index: 500;
    align-items: center; justify-content: center; padding: 1rem;
  }
  #export-modal.visible { display: flex; }
  .modal-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1.5rem;
    width: 100%; max-width: 600px; max-height: 80vh;
    display: flex; flex-direction: column; gap: 1rem;
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-title { font-weight: 600; font-size: 1rem; }
  .modal-close {
    background: none; border: none; color: var(--muted);
    font-size: 1.2rem; cursor: pointer;
  }
  #export-text {
    flex: 1; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 1rem; color: var(--text);
    font-size: 0.8rem; font-family: monospace; resize: none;
    overflow-y: auto; min-height: 300px;
  }
  .modal-actions { display: flex; gap: 0.5rem; }
  .btn-primary {
    background: linear-gradient(135deg, var(--cyan), var(--cyan-dim));
    color: #fff; border: none; border-radius: 8px;
    padding: 0.6rem 1.25rem; font-size: 0.875rem; font-weight: 600;
    cursor: pointer; transition: opacity .2s;
  }
  .btn-primary:hover { opacity: 0.85; }
  .btn-secondary {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 0.6rem 1.25rem;
    color: var(--muted); font-size: 0.875rem; cursor: pointer;
    transition: all .2s;
  }
  .btn-secondary:hover { border-color: var(--cyan); color: var(--cyan); }

  /* ============================================================
     RESPONSIVE — MOBILE
  ============================================================ */
  @media (max-width: 768px) {
    header { padding: 0.6rem 0.75rem; gap: 0.6rem; }
    .header-logo { font-size: 0.95rem; }
    #menu-toggle { display: block; }
    #sidebar {
      position: fixed; left: -260px; top: 0; bottom: 0;
      width: 260px; z-index: 200;
      transition: left .25s ease;
      padding-top: 4rem;
    }
    #sidebar.open { left: 0; box-shadow: 4px 0 20px rgba(0,0,0,.5); }
    .sidebar-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.5); z-index: 150;
    }
    .sidebar-overlay.visible { display: block; }
    main { padding: 1rem; }
    .entry-card { padding: 1rem; }
  }

  @media (min-width: 769px) {
    .sidebar-overlay { display: none !important; }
  }

  /* scrollbar styling */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: var(--surface); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--cyan-dim); }
</style>
</head>

<!-- ============================================================
     PASSWORD GATE

    <input type="password" id="pw-input" placeholder="Enter access password…" autocomplete="current-password">
    <button onclick="checkPassword()">Unlock Wiki →</button>
    <div class="gate-error" id="gate-error">⚠ Incorrect password. Try again.</div>
  </div>
</div>

<!-- Sidebar overlay for mobile -->
<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

<!-- ============================================================
     MAIN APP
============================================================ -->
<div id="app">

  <!-- HEADER -->
  <header>
    <button id="menu-toggle" onclick="toggleSidebar()">☰</button>
    <div class="header-logo">🧠 Memory<span>Wiki</span></div>
    <input type="search" id="search-bar" placeholder="Search all entries…" oninput="onSearch(this.value)" autocomplete="off">
    <div class="header-actions">
      <button class="btn-icon" onclick="openExport()">📄 Export</button>
      <button class="btn-icon" onclick="logout()" title="Lock wiki">🔒</button>

  <!-- LAYOUT -->
  <div class="layout">

    <!-- SIDEBAR -->
    <nav id="sidebar">
      <div class="sidebar-section">

      <div class="sidebar-divider"></div>
      <div class="sidebar-stats" id="sidebar-stats"></div>
    </nav>

    <!-- MAIN -->
    <main id="main-content">
      <div class="results-header">
        <div class="results-title" id="results-title">All Entries</div>
        <div class="results-count" id="results-count"></div>
      </div>
      <div id="entries-list"></div>
    </main>

  </div><!-- /.layout -->

  <!-- FOOTER -->
  <footer>
    <span>🧠 Memory Wiki — Matt's Private Knowledge Base</span>
    <span>Last updated: May 30, 2026 · <span id="entry-total"></span></span>
  </footer>

</div><!-- /#app -->

<!-- ============================================================
     EXPORT MODAL
============================================================ -->
<div id="export-modal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">📄 Export / Print</div>
      <button class="modal-close" onclick="closeExport()">✕</button>
    </div>
    <textarea id="export-text" readonly></textarea>
    <div class="modal-actions">
      <button class="btn-primary" onclick="copyExport()">📋 Copy All</button>
      <button class="btn-secondary" onclick="printExport()">🖨 Print</button>
      <button class="btn-secondary" onclick="closeExport()">Close</button>
    </div>
  </div>
</div>

/* ============================================================
   APP STATE
============================================================ */
let currentCategory = 'all';
let currentSearch = '';
let expandedIds = new Set();

/* ============================================================
   PASSWORD GATE
============================================================ */
function checkPassword() {
  const val = document.getElementById('pw-input').value;
  if (val === CONFIG.password) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').classList.add('visible');
    init();
  } else {
    const err = document.getElementById('gate-error');
    err.style.display = 'block';
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
    setTimeout(() => err.style.display = 'none', 3000);
  }
}

document.getElementById('pw-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkPassword();
});

function logout() {
  document.getElementById('app').classList.remove('visible');
  document.getElementById('gate').style.display = 'flex';
  document.getElementById('pw-input').value = '';
  currentCategory = 'all';
  currentSearch = '';
  expandedIds.clear();
}

/* ============================================================
   INIT
============================================================ */
function init() {
  buildSidebar();
  renderEntries();
  document.getElementById('entry-total').textContent = ENTRIES.length + ' entries';
}

/* ============================================================
   SIDEBAR
============================================================ */
function buildSidebar() {
  const list = document.getElementById('cat-list');
  list.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const count = cat.id === 'all'
      ? ENTRIES.length
      : ENTRIES.filter(e => e.category === cat.id).length;
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (cat.id === currentCategory ? ' active' : '');
    btn.dataset.cat = cat.id;
    btn.innerHTML = `<span>${cat.icon}</span><span>${cat.label}</span><span class="cat-count">${count}</span>`;
    btn.onclick = () => selectCategory(cat.id);
    list.appendChild(btn);
  });

  // Stats
  const stats = document.getElementById('sidebar-stats');
  const financeCount = ENTRIES.filter(e => e.category === 'Finance').length;
  const empireCount = ENTRIES.filter(e => e.category === 'Empire').length;
  stats.innerHTML = `${ENTRIES.length} total entries<br>${financeCount} finance · ${empireCount} empire`;
}

function selectCategory(catId) {
  currentCategory = catId;
  currentSearch = '';
  document.getElementById('search-bar').value = '';
  buildSidebar();
  renderEntries();
  closeSidebar();
}

/* ============================================================
   SEARCH
============================================================ */
function onSearch(val) {
  currentSearch = val.trim().toLowerCase();
  renderEntries();
}

function getFilteredEntries() {
  let results = ENTRIES;
  if (currentCategory !== 'all') {
    results = results.filter(e => e.category === currentCategory);
  }
  if (currentSearch) {
    results = results.filter(e =>
      e.title.toLowerCase().includes(currentSearch) ||
      e.content.toLowerCase().includes(currentSearch) ||
      (e.tags || []).some(t => t.toLowerCase().includes(currentSearch)) ||
      e.category.toLowerCase().includes(currentSearch) ||
      e.date.toLowerCase().includes(currentSearch)
    );
  }
  return results;
}

/* ============================================================
   RENDER ENTRIES
============================================================ */
function highlightText(text, query) {
  if (!query) return escapeHtml(text);
  const escaped = escapeHtml(text);
  const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return escaped.replace(new RegExp('(' + escapedQuery + ')', 'gi'), '<mark>$1</mark>');
}

function escapeHtml(text) {
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function getCategoryIcon(catId) {
  const cat = CATEGORIES.find(c => c.id === catId);
  return cat ? cat.icon : '';
}

function renderEntries() {
  const filtered = getFilteredEntries();
  const container = document.getElementById('entries-list');
  const titleEl = document.getElementById('results-title');
  const countEl = document.getElementById('results-count');

  // Update header
  if (currentSearch) {
    titleEl.textContent = `Search: "${currentSearch}"`;
  } else if (currentCategory === 'all') {
    titleEl.textContent = 'All Entries';
  } else {
    const cat = CATEGORIES.find(c => c.id === currentCategory);
    titleEl.textContent = cat ? `${cat.icon} ${cat.label}` : currentCategory;
  }
  countEl.textContent = `${filtered.length} ${filtered.length === 1 ? 'entry' : 'entries'}`;

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <p>No entries found${currentSearch ? ` for "<strong>${escapeHtml(currentSearch)}</strong>"` : ''}.</p>
      </div>`;
    return;
  }

  container.innerHTML = filtered.map(entry => {
    const isExpanded = expandedIds.has(entry.id);
    const icon = getCategoryIcon(entry.category);
    const tagsHtml = entry.tags && entry.tags.length
      ? `<div class="entry-tags">${entry.tags.map(t => `<span class="tag">${highlightText(t, currentSearch)}</span>`).join('')}</div>`
      : '';

    return `
    <div class="entry-card${isExpanded ? ' expanded' : ''}" data-cat="${escapeHtml(entry.category)}" data-id="${escapeHtml(entry.id)}" onclick="toggleEntry('${escapeHtml(entry.id)}')">
      <div class="entry-header">
        <div class="entry-left">
          <div class="entry-title">${highlightText(entry.title, currentSearch)}</div>
          <div class="entry-meta">
            <span class="entry-cat">${icon} ${entry.category}</span>
            <span class="entry-date">${entry.date}</span>
          </div>
        </div>
        <div class="entry-chevron">▼</div>
      </div>
      <div class="entry-body">
        <div class="entry-content">${highlightText(entry.content, currentSearch)}</div>
        ${tagsHtml}
      </div>
    </div>`;
  }).join('');
}

function toggleEntry(id) {
  if (expandedIds.has(id)) {
    expandedIds.delete(id);
  } else {
    expandedIds.add(id);
  }
  // Re-render only the specific card for performance
  const card = document.querySelector(`[data-id="${id}"]`);
  if (card) {
    const isNowExpanded = expandedIds.has(id);
    card.classList.toggle('expanded', isNowExpanded);
    const body = card.querySelector('.entry-body');
    if (body) body.style.display = isNowExpanded ? 'block' : 'none';
    // Force CSS display via class
  }
}

/* ============================================================
   MOBILE SIDEBAR TOGGLE
============================================================ */
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  sidebar.classList.toggle('open');
  overlay.classList.toggle('visible');
}

function closeSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  sidebar.classList.remove('open');
  overlay.classList.remove('visible');
}

/* ============================================================
   EXPORT / PRINT
============================================================ */
function openExport() {
  const filtered = getFilteredEntries();
  let text = `MEMORY WIKI — Matt's Knowledge Base\n`;
  text += `Last Updated: ${CONFIG.lastUpdated}\n`;
  text += `Exported: ${new Date().toLocaleDateString('en-US', {month:'long',day:'numeric',year:'numeric'})}\n`;
  text += `Category: ${currentCategory === 'all' ? 'All Entries' : currentCategory}\n`;
  text += `Entries: ${filtered.length}\n`;
  text += `${'═'.repeat(60)}\n\n`;

  filtered.forEach(entry => {
    text += `${entry.title.toUpperCase()}\n`;
    text += `Category: ${entry.category}  |  Date: ${entry.date}\n`;
    text += `${'-'.repeat(50)}\n`;
    text += entry.content + '\n';
    if (entry.tags && entry.tags.length) {
      text += `\nTags: ${entry.tags.join(', ')}\n`;
    }
    text += `\n${'═'.repeat(60)}\n\n`;
  });

  document.getElementById('export-text').value = text;
  document.getElementById('export-modal').classList.add('visible');
}

function closeExport() {
  document.getElementById('export-modal').classList.remove('visible');
}

function copyExport() {
  const textarea = document.getElementById('export-text');
  textarea.select();
  document.execCommand('copy');
  const btn = event.target;
  const orig = btn.textContent;
  btn.textContent = '✓ Copied!';
  setTimeout(() => btn.textContent = orig, 2000);
}

function printExport() {
  const text = document.getElementById('export-text').value;
  const win = window.open('', '_blank');
  win.document.write(`<html><head><title>Memory Wiki Export</title>
  <style>body{font-family:monospace;font-size:12px;white-space:pre-wrap;padding:20px;color:#000;background:#fff;}</style>
  </head><body>${text.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</body></html>`);
  win.document.close();
  win.print();
}

// Close export modal on outside click
document.getElementById('export-modal').addEventListener('click', function(e) {
  if (e.target === this) closeExport();
});

// Auto-expand search results if searching
document.getElementById('search-bar').addEventListener('input', function() {
  if (this.value.length > 0) {
    // Auto-expand all results on search
    getFilteredEntries().forEach(e => expandedIds.add(e.id));
  } else {
    expandedIds.clear();
  }
});
</script>
</body>
</html>
